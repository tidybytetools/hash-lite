[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hash-lite"
version = "1.0.0"
description = "Hash text or local files with SHA-256, SHA-1, MD5 and SHA-512. Hex and Base64. Local CLI and MCP server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Tidy Byte Tools"}]
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.10,<2",
]
keywords = ["hash", "checksum", "sha256", "sha1", "md5", "sha512", "cli", "mcp", "mcp-server"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
  "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/tidybytetools/hash-lite"
Documentation = "https://github.com/tidybytetools/hash-lite#readme"
Source = "https://github.com/tidybytetools/hash-lite"
Issues = "https://github.com/tidybytetools/hash-lite/issues"
Changelog = "https://github.com/tidybytetools/hash-lite/blob/main/CHANGELOG.md"
Apify = "https://apify.com/tidybytetools/hash-checksum"

[project.scripts]
hash-lite = "hash_lite:main"
hash-lite-mcp = "hash_lite_mcp:main"

[tool.setuptools]
py-modules = ["hash_lite", "hash_lite_mcp"]
